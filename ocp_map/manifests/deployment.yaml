apiVersion: apps/v1
kind: Deployment
metadata:
  name: revision-history-webhook
  namespace: ocp-map-webhooks
  labels:
    app.kubernetes.io/name: revision-history-webhook
    app.kubernetes.io/part-of: ocp-map
spec:
  replicas: 2
  # This Deployment is also subject to the webhook once registered; the
  # mutator will set revisionHistoryLimit=3 if omitted or different.
  selector:
    matchLabels:
      app.kubernetes.io/name: revision-history-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: revision-history-webhook
        app.kubernetes.io/part-of: ocp-map
    spec:
      serviceAccountName: revision-history-webhook
      containers:
        - name: webhook
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          args:
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            - -listen=:8443
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls
          secret:
            secretName: revision-history-webhook-tls
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: revision-history-webhook
                topologyKey: kubernetes.io/hostname
