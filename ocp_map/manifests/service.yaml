apiVersion: v1
kind: Service
metadata:
  name: revision-history-webhook
  namespace: ocp-map-webhooks
  labels:
    app.kubernetes.io/name: revision-history-webhook
    app.kubernetes.io/part-of: ocp-map
  annotations:
    # OpenShift service-CA issues tls.crt/tls.key into this secret.
    service.beta.openshift.io/serving-cert-secret-name: revision-history-webhook-tls
spec:
  selector:
    app.kubernetes.io/name: revision-history-webhook
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
